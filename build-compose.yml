services:
  kestrelsdev.fileapi:
    image: ghcr.io/kestrelsdevelopment/kestrelsdev.fileapi
    build:
      context: .
      dockerfile: ./KestrelsDev.FileApi/Dockerfile
    environment:
      - API_UPLOAD_PSK=changeme
      - API_UPLOAD_PATH=/files
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - ./files:/files
    ports:
      - "80:80"